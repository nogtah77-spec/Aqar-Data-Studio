kind = "web"
previewPath = "/property-studio/"
title = "Property Studio"
version = "1.0.0"
id = "artifacts/property-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/property-studio/" ]
localPort = 20764

[services.development]
run = "pnpm --filter @workspace/property-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/property-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/property-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20764"
BASE_PATH = "/property-studio/"
